name: Paper-trading tick

# GitHub's own `schedule` trigger was unreliable (confirmed: went hours with zero
# self-fired runs, then only intermittent afterward) -- cron-job.org now pings
# workflow_dispatch every 15 min instead and has been the reliable trigger since.
# Removed schedule here rather than keep both: no cost difference either way,
# this just avoids two independent triggers racing into the same tick (the
# push-conflict handling below still exists as a safety net, but simpler to not
# rely on it routinely). workflow_dispatch stays for cron-job.org and manual runs.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: paper-trading-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    # Belt-and-suspenders bound on total job duration. Individual network calls
    # already have their own timeouts (ccxt/yfinance default to 10s, Polymarket
    # calls use an explicit 15s), but this protects against anything else that
    # could stall (pip install, an infinite loop, an unforeseen hang) -- without
    # it, a stuck run would sit for up to GitHub's 6h default AND, because of the
    # concurrency group below, block every subsequent scheduled tick behind it.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - run: python scheduler.py --once

      - name: Commit updated ledgers
        run: |
          git config user.name "paper-trading-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data_store/
          if git diff --cached --quiet; then
            echo "no ledger changes this tick"
            exit 0
          fi
          git commit -m "tick: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          # main may have moved since checkout -- e.g. a manual push landed while
          # this run was installing deps, or (observed in practice) a scheduled and
          # a manually-triggered run overlapped despite the concurrency group.
          # A non-conflicting divergence (code-only commit) rebases cleanly and we
          # retry the push. A conflicting one (two runs both touched the same
          # binary SQLite ledger) can't be meaningfully 3-way-merged -- rather than
          # fail the job, abort the rebase and drop this run's tick. Losing one
          # periodic price sample is fine; leaving main in a broken state is not.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt), fetching and rebasing"
            git fetch origin main
            if git rebase origin/main; then
              continue
            fi
            echo "rebase hit a conflict (concurrent tick likely touched the same ledger) -- aborting and dropping this run's tick"
            git rebase --abort
            exit 0
          done
          echo "push failed after 5 attempts" >&2
          exit 1
