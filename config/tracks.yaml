  # 2026-10-19: prediction_markets_momentum_2x/10x PAUSED (not deleted -- see
  # the original block preserved below, commented out). These two tracks were
  # repeatedly cycling through loss-cap breach -> epoch reset every few ticks
  # (8-12 resets since the last full reset, both deep in the hole each time),
  # while leverage can only amplify a strategy's existing cost-driven expected
  # value, never create an edge that isn't there -- and this project's own
  # research program (audits/2026-10-12-full-strategy-search-audit-dossier.md,
  # audits/2026-10-12-prediction-markets-final-report.md) found no edge in any
  # strategy tested, on any asset, at any leverage. Scheduler.py already
  # handles a missing config entry gracefully (skips with a log line, no
  # error) -- removing these two from config is a clean, reversible pause; no
  # code change needed. To re-enable, uncomment the block below.
