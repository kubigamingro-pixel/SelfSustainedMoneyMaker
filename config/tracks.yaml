# Per-track configuration for the paper-trading comparison engine.
# All tracks start from the same simulated capital so results are comparable.

tracks:
  crypto_momentum:
    domain: crypto
    symbol: BTC/USD
    exchange: kraken
    strategy: momentum
    strategy_params:
      fast_window: 10
      slow_window: 40
    starting_capital: 10.0
    fee_pct: 0.26        # Kraken taker fee
    slippage_pct: 0.05
    poll_minutes: 15
    loss_cap_pct: 50      # flatten + stop if equity falls below this % of start
    # Deliberately the same flat 50% across all four tracks, not tuned per-market --
    # the point is to cap single-trade variance, not to optimize a number (2026-09-28
    # external strategy audit consensus: all-in sizing turns every strategy error
    # into a full account-level shock; a simple round fraction is the fix, not a
    # risk-budget/volatility-target model this dataset is too small to calibrate).
    position_size_pct: 50

  crypto_mean_reversion:
    domain: crypto
    symbol: ETH/USD
    exchange: kraken
    strategy: mean_reversion
    strategy_params:
      rsi_period: 21
      oversold: 20
      overbought: 80
    starting_capital: 10.0
    fee_pct: 0.26
    slippage_pct: 0.05
    poll_minutes: 15
    loss_cap_pct: 50
    position_size_pct: 50

  stocks_momentum:
    domain: stocks
    symbol: SPY
    strategy: momentum
    strategy_params:
      fast_window: 10
      slow_window: 40
    starting_capital: 10.0
    fee_pct: 0.0           # modern brokers are commission-free; modeled for realism later
    slippage_pct: 0.02
    poll_minutes: 15
    loss_cap_pct: 50
    position_size_pct: 50

  prediction_markets_momentum:
    domain: prediction_markets
    symbol: null            # resolved at runtime: highest-volume active Polymarket market
    strategy: momentum
    strategy_params:
      fast_window: 10
      slow_window: 40
    starting_capital: 10.0
    fee_pct: 2.0             # Polymarket taker-side spread/fee approximation
    slippage_pct: 0.5
    poll_minutes: 15
    loss_cap_pct: 50
    position_size_pct: 50
    # 2026-10-12 fix-check review (findings #2/#3): pick_active_market() only
    # checks this band when a market is first picked -- re-checked here at
    # entry time too (engine/risk.py:passes_price_band), matching
    # engine/data/prediction_source.py's PRICE_BAND constant.
    price_band: [0.10, 0.90]

  # --- Leveraged variants (added 2026-10-01) ---
  # Same 4 strategies/markets above, same fee/slippage/position-sizing/loss-cap
  # philosophy, but trading on margin: 2x and 10x leverage, $50 starting capital
  # each (not $10, per explicit request). leverage and funding_rate_annual_pct
  # are deliberately identical across all 8 of these -- not tuned per-track, same
  # reasoning as position_size_pct above. funding_rate_annual_pct=10 is a simple,
  # round, illustrative assumption (real perpetual-futures funding is periodic,
  # variable, and can flip sign -- see engine/leverage_risk.py), not a fitted
  # number. Liquidation (engine/leverage_risk.py) is a NEW failure mode these
  # tracks have that the originals don't: an adverse move can force-close a
  # position and lose its margin well before the account-level loss cap would
  # ever trigger.
  #
  # Honesty note: prediction_markets_momentum_2x/10x are a hypothetical
  # comparison only -- Polymarket does not actually offer margin/leveraged
  # trading on its markets. This is "what if this strategy were leveraged",
  # not a simulation of any real available product for that market.

  crypto_momentum_2x:
    domain: crypto
    symbol: BTC/USD
    exchange: kraken
    strategy: momentum
    strategy_params:
      fast_window: 10
      slow_window: 40
    starting_capital: 50.0
    fee_pct: 0.26
    slippage_pct: 0.05
    poll_minutes: 15
    loss_cap_pct: 50
    position_size_pct: 50
    leverage: 2
    funding_rate_annual_pct: 10

  crypto_momentum_10x:
    domain: crypto
    symbol: BTC/USD
    exchange: kraken
    strategy: momentum
