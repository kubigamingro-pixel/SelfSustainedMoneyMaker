  # --- Regime-filtered momentum variants (added 2026-10-02) ---
  # Same 3 momentum markets above (not crypto_mean_reversion -- that's a
  # different base strategy), same cost/sizing assumptions, but the entry
  # signal is additionally gated: only buy a crossover if the slow SMA itself
  # is rising (engine/strategies/momentum_regime_filtered.py), a pattern
  # adapted from freqtrade's "guard condition" approach. 1x only for now --
  # stacking leverage with an untested filter would muddy whether any result
  # is from the filter or the leverage. $10 starting capital, matching the
  # original 1x tracks (not the leveraged $50 ones).

  crypto_momentum_regime:
