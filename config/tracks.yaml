    leverage: 10
    funding_rate_annual_pct: 10

  stocks_momentum_2x:
    domain: stocks
    symbol: SPY
    strategy: momentum
    strategy_params:
      fast_window: 10
      slow_window: 40
    starting_capital: 50.0
    fee_pct: 0.0
    slippage_pct: 0.02
    poll_minutes: 15
    loss_cap_pct: 50
    position_size_pct: 50
    leverage: 2
    funding_rate_annual_pct: 10

  stocks_momentum_10x:
    domain: stocks
    symbol: SPY
    strategy: momentum
    strategy_params:
      fast_window: 10
      slow_window: 40
    starting_capital: 50.0
